name: Print Software Versions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  data-processing-software:
    name: Data Processing Software Versions
    runs-on: ubuntu-latest

    steps:
      - name: Print OS version (Ubuntu)
        run: lsb_release -a || cat /etc/os-release

      - name: Print PHP version (Laravel environment)
        run: php -v

      - name: Print Composer version
        run: composer --version || echo "Composer not installed"

      - name: Install TensorFlow Lite dependencies (Python)
        run: |
          python3 --version
          pip3 install tflite-runtime || echo "tflite-runtime not available for installation"
          python3 -c "import tflite_runtime; print('TensorFlow Lite runtime version:', tflite_runtime.__version__)" || echo "Cannot import tflite_runtime"

  database-software:
    name: Database Software Versions
    needs: data-processing-software
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Print PostgreSQL version
        run: psql --version
